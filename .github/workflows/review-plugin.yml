name: Review Community Plugin

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.check.outputs.triggered }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Check trigger
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.trim();
            const triggered = !!context.payload.issue.pull_request && /^@tubabot\s+review\b/i.test(comment);
            core.setOutput('triggered', String(triggered));
            core.setOutput('pr_number', String(context.payload.issue.number));
      - name: Acknowledge
        if: steps.check.outputs.triggered == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const target = {owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number};
            try { await github.rest.issues.removeLabel({...target, name: 'verified'}); } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.issues.createComment({...target, body: '🔍 **TubaBot** 正在扫描病毒，请稍候...'});

  virus-scan:
    needs: check-trigger
    if: needs.check-trigger.outputs.triggered == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare isolated scan paths
        run: |
          echo "SCAN_DIR=$RUNNER_TEMP/plugin-review/input" >> "$GITHUB_ENV"
          echo "RESULTS_DIR=$RUNNER_TEMP/plugin-review/results" >> "$GITHUB_ENV"
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo,
              pull_number: Number('${{ needs.check-trigger.outputs.pr_number }}')});
            core.setOutput('head_sha', pr.head.sha);
      # Execute trusted default-branch scripts. Store inputs/results outside PR content.
      - name: Checkout trusted scripts and rules
        uses: actions/checkout@v4
        with:
          path: bot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect files from PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          mkdir -p "$SCAN_DIR" "$RESULTS_DIR"
          set +e
          python3 bot/scripts/collect-pr-files.py "${{ needs.check-trigger.outputs.pr_number }}" "$SCAN_DIR"
          code=$?
          set -e
          printf '%s\n' "$code" > "$RESULTS_DIR/collect.exit"
      - name: Install scanners
        run: sudo apt-get update && sudo apt-get install -y clamav yara
      - name: Update virus database
        run: sudo freshclam --quiet
        timeout-minutes: 5
      - name: ClamAV scan
        run: |
          set +e
          clamscan --recursive --infected "$SCAN_DIR" > "$RESULTS_DIR/clamav.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$RESULTS_DIR/clamav.exit"
      - name: YARA scan
        run: |
          set +e
          yara -r bot/rules/malware.yar "$SCAN_DIR" > "$RESULTS_DIR/yara.txt" 2> "$RESULTS_DIR/yara.log"
          code=$?
          set -e
          printf '%s\n' "$code" > "$RESULTS_DIR/yara.exit"
      - name: VirusTotal check
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set +e
          python3 bot/scripts/virustotal-check.py "$SCAN_DIR" > "$RESULTS_DIR/virustotal.json" 2> "$RESULTS_DIR/virustotal.log"
          code=$?
          set -e
          printf '%s\n' "$code" > "$RESULTS_DIR/virustotal.exit"
      - name: Build summary
        run: python3 bot/scripts/scan_summary.py "$RESULTS_DIR" > "$RESULTS_DIR/summary.json"
      - name: Post scan report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summary = JSON.parse(fs.readFileSync(path.join(process.env.RESULTS_DIR, 'summary.json'), 'utf8'));
            const target = {owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number('${{ needs.check-trigger.outputs.pr_number }}')};
            const {data: pr} = await github.rest.pulls.get({owner: target.owner, repo: target.repo, pull_number: target.issue_number});
            if (pr.head.sha !== '${{ steps.pr.outputs.head_sha }}') {
              summary.label = 'needs-review';
              summary.overall = 'review';
              summary.report += '\n\n⚠️ PR 提交已变化，本结果不能验证当前提交，请重新扫描。';
            }
            await github.rest.issues.createComment({...target, body: summary.report});
            await github.rest.issues.addLabels({...target, labels: [summary.label]});
            for (const name of ['verified', 'needs-review', 'malware-detected'].filter(x => x !== summary.label)) {
              try { await github.rest.issues.removeLabel({...target, name}); } catch (error) { if (error.status !== 404) throw error; }
            }
            if (summary.overall !== 'pass') core.setFailed('Scan incomplete or needs review');
