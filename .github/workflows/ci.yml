name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [p for p in Path('.').rglob('*.json') if '.git' not in p.parts]
          assert files, 'No JSON files found'
          for path in files:
              json.loads(path.read_text(encoding='utf-8-sig'))
          print(f'Validated {len(files)} JSON files')
          PY
